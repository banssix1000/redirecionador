
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">
<title>Presente especial</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #30200c, #100c07 55%, #050505);
    font-family: Arial, sans-serif;
    color: white;
}

.container {
    width: 100%;
    max-width: 450px;
    padding: 25px;
    text-align: center;
}

h1 {
    font-size: 28px;
    margin-bottom: 12px;
}

h1 span {
    color: #ffd34d;
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    line-height: 1.6;
}

.gift-area {
    height: 310px;
    display: flex;
    justify-content: center;
    align-items: center;
}

.gift-button {
    border: 0;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.gift {
    width: 210px;
    height: 200px;
    position: relative;
    animation: float 2.5s ease-in-out infinite;
    filter: drop-shadow(0 15px 25px #ffbd2e55);
}

/* Corpo dourado */
.box {
    position: absolute;
    bottom: 0;
    left: 10px;
    width: 190px;
    height: 125px;
    border-radius: 7px 7px 13px 13px;
    background: linear-gradient(
        110deg,
        #c58a13,
        #ffe68a 30%,
        #ffca3a 65%,
        #b77a08
    );
    box-shadow: inset -12px 0 18px #86530055;
}

/* Fita vermelha vertical */
.box::before {
    content: "";
    position: absolute;
    left: 77px;
    width: 36px;
    height: 100%;
    background: linear-gradient(
        90deg,
        #a90000,
        #ff3830,
        #c40000
    );
}

/* Tampa dourada */
.lid {
    position: absolute;
    z-index: 3;
    top: 56px;
    left: 0;
    width: 210px;
    height: 42px;
    border-radius: 8px;
    background: linear-gradient(
        180deg,
        #fff0a0,
        #ffd34c 45%,
        #c58b13
    );
    box-shadow: 0 7px 12px #0008;
}

/* Fita vermelha na tampa */
.lid::after {
    content: "";
    position: absolute;
    left: 87px;
    width: 36px;
    height: 100%;
    background: linear-gradient(
        90deg,
        #a90000,
        #ff3830,
        #c40000
    );
}

/* Laço vermelho */
.bow {
    position: absolute;
    z-index: 5;
    top: 0;
    left: 30px;
    width: 150px;
    height: 70px;
}

.loop {
    position: absolute;
    top: 5px;
    width: 75px;
    height: 48px;
    border: 13px solid #e51616;
    box-shadow: 0 0 12px #ff302088;
}

.loop.left {
    left: 0;
    border-radius: 65% 35% 55% 45%;
    transform: rotate(25deg);
}

.loop.right {
    right: 0;
    border-radius: 35% 65% 45% 55%;
    transform: rotate(-25deg);
}

.knot {
    position: absolute;
    z-index: 6;
    width: 30px;
    height: 30px;
    left: 60px;
    top: 23px;
    border-radius: 7px;
    transform: rotate(45deg);
    background: linear-gradient(135deg, #ff5550, #a90000);
    box-shadow: 0 0 12px #ff3020aa;
}

.click-text {
    display: block;
    margin-top: 22px;
    color: #ffcf48;
    font-size: 17px;
    font-weight: 900;
    letter-spacing: 3px;
    text-shadow: 0 0 15px #ffb00088;
}

.hint {
    padding: 17px;
    border: 1px solid #80601e66;
    background: #ffffff08;
    border-radius: 12px;
    color: #aaa;
    font-size: 13px;
}

.hint span {
    color: #ffd34d;
    font-weight: bold;
}

.sparkle {
    position: fixed;
    color: #ffda65;
    animation: shine 2s infinite;
    pointer-events: none;
}

.s1 { top: 22%; left: 12%; }
.s2 { top: 35%; right: 12%; animation-delay: .5s; }
.s3 { bottom: 22%; left: 18%; animation-delay: 1s; }
.s4 { bottom: 28%; right: 18%; animation-delay: .7s; }

@keyframes float {
    0%, 100% { transform: translateY(0) rotate(-1deg); }
    50% { transform: translateY(-13px) rotate(1deg); }
}

@keyframes shine {
    0%, 100% { opacity: .2; transform: scale(.7); }
    50% { opacity: 1; transform: scale(1.3); }
}
</style>
</head>

<body>

<div class="sparkle s1">✦</div>
<div class="sparkle s2">✧</div>
<div class="sparkle s3">✦</div>
<div class="sparkle s4">✧</div>

<main class="container">

    <h1>Tem um <span>presente</span> para você!</h1>

    <p class="subtitle">
        Preparamos uma surpresa especial.
        Clique no presente para receber!
    </p>

    <div class="gift-area">

        <button class="gift-button" onclick="abrirPresente()">
            <div class="gift">
                <div class="bow">
                    <div class="loop left"></div>
                    <div class="loop right"></div>
                    <div class="knot"></div>
                </div>

                <div class="lid"></div>
                <div class="box"></div>
            </div>

            <span class="click-text">CLIQUE AQUI</span>
        </button>

    </div>

    <div class="hint">
        🎁 Clique no presente para liberar
        <span>seu acesso!</span>
    </div>

</main>

<script>
const DESTINO = "https://SEU-LINK-AQUI.com";

function abrirPresente() {
    if (DESTINO === "https://SEU-LINK-AQUI.com") {
        alert("Configure o link de destino no código!");
        return;
    }

    window.location.assign(DESTINO);
}
</script>

</body>
</html>
